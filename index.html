<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皮克敏班級任務整合系統</title>
  <style>
    @font-face {
      font-family: '芫荽';
      src: url('https://cdn.jsdelivr.net/gh/fonfont/芫荽/芫荽.ttf') format('truetype');
    }

    :root {
      --morandi-green: #e2ebd9;
      --morandi-yellow: #f7f0e6;
      --morandi-blue: #e4ecef;
      --card-bg: #ffffff;
      --text-dark: #2d3748;
      --p-red: #e53e3e;
      --p-yellow: #d69e2e;
      --p-blue: #3182ce;
      --p-purple: #805ad5;
      --p-white: #718096;
      --p-pink: #ed64a6;
      --p-rock: #4a5568;
      --p-ice: #319795;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: '芫荽', 'Microsoft JhengHei', sans-serif;
    }

    body {
      background-color: var(--morandi-green);
      background-image: radial-gradient(#b0bec5 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-dark);
      padding: 16px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.4s ease;
    }

    body.mode-morning { background-color: var(--morandi-green); }
    body.mode-lunch { background-color: var(--morandi-yellow); }
    body.mode-wednesday { background-color: var(--morandi-blue); }

    header {
      background: linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(240,248,240,0.95) 100%);
      padding: 18px 30px;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
      border: 3px solid #ffffff;
    }

    .nav-tabs { display: flex; gap: 12px; }

    .tab-btn {
      background: #edf2f7;
      color: #4a5568;
      border: 2.5px solid #cbd5e0;
      padding: 12px 22px;
      border-radius: 22px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tab-btn:hover { transform: translateY(-3px); }
    .tab-btn.active {
      background: #38a169;
      color: white;
      border-color: #276749;
      box-shadow: 0 6px 18px rgba(56, 161, 105, 0.4);
      transform: scale(1.06);
    }
    body.mode-lunch .tab-btn.active { background: #dd6b20; border-color: #9c4221; box-shadow: 0 6px 18px rgba(221, 107, 32, 0.4); }
    body.mode-wednesday .tab-btn.active { background: #3182ce; border-color: #2b6cb0; box-shadow: 0 6px 18px rgba(49, 130, 206, 0.4); }

    .header-center { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

    .date-time-box {
      background: #ffffff;
      border: 3px solid #f6ad55;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 1.25rem;
      font-weight: 900;
      color: #7b341e;
      box-shadow: 0 4px 12px rgba(246, 173, 85, 0.2);
    }

    .task-start-btn {
      background: #3182ce;
      color: white;
      border: 2.5px solid #2b6cb0;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
      transition: all 0.2s;
    }
    .task-start-btn:hover { transform: scale(1.05); background: #2b6cb0; }

    .task-start-time {
      font-size: 1.05rem;
      color: #2b6cb0;
      font-weight: 900;
      background: #ebf8ff;
      padding: 10px 18px;
      border-radius: 18px;
      border: 2.5px solid #bee3f8;
    }

    .action-btns { display: flex; gap: 10px; flex-wrap: wrap; }

    .export-btn {
      background: #38a169;
      color: white;
      border: 2.5px solid #276749;
      padding: 10px 18px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(56, 161, 105, 0.2);
      transition: all 0.2s;
    }
    .export-btn:hover { background: #2f855a; transform: translateY(-2px); }

    .reset-btn {
      background: #edf2f7;
      color: #718096;
      border: 2.5px solid #cbd5e0;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
    }

    .students-single-row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .student-card {
      background: white;
      border-radius: 20px;
      padding: 14px 10px 16px 10px;
      flex: 1;
      min-width: 155px;
      max-width: 190px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 8px solid #ccc;
      position: relative;
      transition: all 0.3s ease;
    }

    .student-card.on-leave {
      opacity: 0.55;
      background: #f1f3f5;
    }

    .leave-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #f8f9fa;
      border: 1.5px solid #ced
